<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traits</title>
<meta name="color-scheme" content="dark">
<style>html, body { background: transparent; }</style>
<link rel="stylesheet" href="ascension.css">
<style>
  .top { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 2px solid var(--line); }
  .top .nm { font-size: var(--fs-name); text-shadow: var(--glow); }
  .grade { display: inline-block; padding: 1px 8px; font-size: var(--fs-meta); letter-spacing: .1em; color: #fff; background: #293547; border: 2px solid var(--outline); }
  .pend { margin-left: auto; text-align: right; } .pend b { font-size: var(--fs-hero); line-height: 1; color: var(--acc); text-shadow: var(--glow); }
  .stage { width: 108px; height: 72px; }
  .sprbox { display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 132px; gap: 12px; padding: 10px 14px; }
  .work { min-height: 0; display: flex; flex-direction: column; }
  /* the mechanic rail: each mechanic has its own pixel icon and hue (MODE_INFO below); the chosen one tints the list and detail through --acc */
  .rail { display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .rail .gap { height: 4px; flex: none; }
  .tab { display: grid; grid-template-columns: 20px 1fr auto; column-gap: 8px; align-items: center; padding: 3px 7px; text-align: left; background: var(--row);
         border: 2px solid transparent; color: var(--muted); box-shadow: none; text-shadow: none; }
  .tab .ico { grid-row: span 2; width: 20px; height: 20px; color: var(--hue); opacity: .72; }
  .tab .tn { color: var(--ink); font-size: var(--fs-body); line-height: 1.2; } .tab .ts { grid-column: 2; font-size: var(--fs-meta); line-height: 1.2; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .n { grid-row: span 2; grid-column: 3; min-width: 18px; padding: 0 4px; text-align: center; font-size: var(--fs-meta); color: #04222c; background: var(--hue); border: 2px solid var(--outline); }
  .tab:hover:not(:disabled) { border-color: var(--line); color: var(--ink); } .tab:hover:not(:disabled) .ico { opacity: 1; }
  .tab.on { border-color: var(--hue); background: var(--tint); } .tab.on .ico { opacity: 1; filter: drop-shadow(0 0 3px var(--hue)); } .tab.on .tn { color: var(--hue); text-shadow: var(--glow); }
  .tab:active:not(:disabled) { transform: none; }
  .banner { padding: 4px 10px; font-size: var(--fs-body); border: 2px solid var(--line); background: var(--row); }
  .banner.ok { border-color: var(--good); background: #0d2a1c; color: var(--ink); } .banner.bad { border-color: var(--warn); background: #2b1612; color: var(--ink); }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 172px 192px 1fr; gap: 8px; }
  html.calm .work { --glow: none !important; }
  /* the detail's own heading: the mechanic's icon, name and what it is for */
  .dhead { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 2px solid var(--line); }
  .dhead .ico { width: 30px; height: 30px; flex: none; color: var(--acc); filter: drop-shadow(0 0 4px var(--acc)); }
  .dhead .mn { font-size: var(--fs-name); color: var(--acc); text-shadow: var(--glow); letter-spacing: .06em; } .dhead .mv { font-size: var(--fs-meta); color: var(--muted); }
  .dhead .help { margin-left: auto; padding: 1px 8px; font-size: var(--fs-body); }
  html.calm .tab.on .ico, html.calm .dhead .ico { filter: none; }
  /* Refine: where the value sits in its rank's range, with the floor a Perfect has locked in */
  .range { margin: 4px 0 10px; } .range .trk { position: relative; height: 12px; background: var(--well); border: 2px solid var(--line); }
  .range .fl { position: absolute; top: 0; bottom: 0; left: 0; background: repeating-linear-gradient(90deg, #1c4a5e 0 2px, transparent 2px 4px); }
  .range .pin { position: absolute; top: -5px; width: 4px; height: 18px; margin-left: -2px; background: var(--acc); box-shadow: 0 0 0 2px var(--outline); }
  .range .ends { display: flex; justify-content: space-between; font-size: var(--fs-meta); color: var(--muted); margin-top: 3px; }
  /* Overreach: the odds as one bar, win in the mechanic's hue */
  .gamble { display: flex; height: 14px; margin: 2px 0 3px; border: 2px solid var(--line); background: #2b1612; } .gamble i { display: block; background: var(--acc); box-shadow: var(--glow); }
  .gamble-k { display: flex; justify-content: space-between; font-size: var(--fs-meta); margin-bottom: 8px; } .gamble-k .w { color: var(--acc); }
  /* Promote: the six tiers, where this Pokémon is and where it goes next */
  .ladder { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 8px 0; }
  .ladder div { text-align: center; font-size: var(--fs-meta); color: var(--muted); } .ladder i { display: block; height: 10px; margin-bottom: 3px; background: var(--well); border: 2px solid var(--line); }
  .ladder .past i { background: var(--tier); border-color: var(--outline); opacity: .45; }
  .ladder .now i { background: var(--tier); border-color: var(--outline); } .ladder .now { color: var(--ink); }
  .ladder .to i { border-color: var(--tier); box-shadow: var(--glow); } .ladder .to { color: var(--tier); }
  /* the first-open tutorial: a coach card over the detail, once per mechanic per player */
  .coach { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; padding: 12px 14px; background: var(--panel); border: 2px solid var(--acc); box-shadow: var(--glow); }
  .coach .ct { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .coach .ct .ico { width: 30px; height: 30px; color: var(--acc); }
  .coach .ct b { display: block; font-size: var(--fs-name); color: var(--acc); text-shadow: var(--glow); } .coach .ct span { font-size: var(--fs-meta); color: var(--muted); }
  .coach dl { margin: 0; display: grid; grid-template-columns: 52px 1fr; gap: 8px 10px; }
  .coach dt { font-size: var(--fs-meta); letter-spacing: .08em; color: var(--acc); padding-top: 1px; } .coach dd { margin: 0; line-height: 1.45; }
  .coach .go { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 10px; }
  .coach .go .muted { font-size: var(--fs-meta); }
  .list { overflow-y: auto; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 2px solid transparent; margin-bottom: 3px; cursor: pointer; background: var(--row); }
  .row:hover { border-color: var(--line); } .row.sel { border-color: var(--acc); box-shadow: var(--glow); }
  .row .ic { width: 18px; height: 18px; flex: none; border: 2px solid var(--outline); }
  .row .t1 { font-size: var(--fs-body); } .row .t2 { font-size: var(--fs-meta); color: var(--muted); } .row .v { margin-left: auto; color: var(--acc); text-shadow: var(--glow); }
  .row.off .t1 { color: var(--muted); }
  .pair { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
  .vbox { flex: 1; padding: 8px; background: var(--row); border: 2px solid var(--line); text-align: center; }
  .vbox.next { border-color: var(--acc); box-shadow: var(--glow); } .vbox .big { font-size: var(--fs-hero); color: var(--acc); text-shadow: var(--glow); } .vbox .sm { font-size: var(--fs-meta); color: var(--muted); }
  .cost { margin-top: auto; border-top: 2px solid var(--line); padding-top: 8px; display: flex; align-items: center; gap: 10px; }
  .cost .c { flex: 1; }
  .wallet { overflow-y: auto; }
  .wallet .coin { display: flex; align-items: center; gap: 8px; padding: 3px 2px; border-bottom: 1px solid var(--line); }
  /* the materials the chosen mechanic spends stand out in its colour; the rest step back */
  .wallet .coin.use { background: var(--tint, transparent); box-shadow: inset 0 0 0 1px var(--acc); }
  .wallet .coin.use .cn { color: var(--acc); }
  .wallet .coin.idle { opacity: .42; }
  .wallet .dot { width: 24px; height: 24px; flex: none; }   /* a smooth downscale of the 32px art: 24 is not a whole fraction of 32 */
  .row.haunt { border-color: var(--line); margin-top: 8px; } .row.haunt.sel { border-color: var(--acc); }
  .row.haunt .t1 { color: #ff9a3c; text-shadow: 0 0 5px rgba(255, 154, 60, .45); } .row.haunt .t2 { color: #d08a45; }
  .row.haunt .ic, .hname .ic { width: 24px; height: 24px; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; border: 0; }
  .hname { display: flex; align-items: center; gap: 10px; margin: 2px 0 4px; } .hname .ic { width: 40px; height: 40px; } .hname .nm { font-size: var(--fs-name); text-shadow: var(--glow); }
  .tag { display: inline-block; padding: 0 6px; font-size: var(--fs-meta); letter-spacing: .1em; border: 2px solid var(--outline); background: var(--epic-bg); color: var(--epic); margin-left: 6px; vertical-align: middle; }
  .tag.rare { background: #5a2e08; color: var(--legendary); }
  .odds { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 14px; margin: 6px 0; font-size: var(--fs-meta); }
  .odds div { display: flex; gap: 6px; padding: 0 3px; } .odds div.cur { background: var(--well); color: var(--acc); } .odds i { margin-left: auto; font-style: normal; color: var(--muted); } .odds .rr { color: var(--legendary); }
  #detail { overflow-y: auto; position: relative; }
  .rodds { margin-top: 8px; } .odds-h { font-size: var(--fs-meta); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .odds-l { display: grid; gap: 2px; max-height: 108px; overflow-y: auto; padding-right: 4px; }
  .odds-r { display: grid; grid-template-columns: 1fr 90px 44px; gap: 8px; align-items: center; font-size: var(--fs-meta); }
  .odds-r.now .odds-n { color: var(--acc); }
  .odds-b { height: 6px; background: var(--well); border: 1px solid var(--line); } .odds-b i { display: block; height: 100%; background: var(--acc); }
  .odds-p { text-align: right; font-variant-numeric: tabular-nums; }
  /* the one moment on this screen: when a craft lands, a bright line sweeps down the detail panel in the mechanic's colour (Calm removes it) */
  #detail.landed::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--acc); box-shadow: 0 0 0 1px var(--outline); pointer-events: none;
                          animation: landed .55s steps(12) 1 forwards; }
  @keyframes landed { from { top: 0; opacity: 1; } to { top: calc(100% - 4px); opacity: 0; } }
  .meter { height: 10px; background: var(--well); border: 2px solid var(--line); } .meter i { display: block; height: 100%; background: var(--acc); box-shadow: var(--glow); }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>TRAITS</span><button class="x" id="close" title="Close">&times;</button></div>
  <div class="top">
    <div id="art" class="stage"></div>
    <div><div class="nm" id="name"></div><div><span class="muted" id="lvl"></span> <span class="grade" id="grade"></span></div></div>
    <div class="pend"><b id="pend">0</b><div class="muted" id="pendLabel"></div></div>
  </div>
  <div class="body">
    <div class="work">
      <div class="split">
        <nav class="rail" id="tabs" aria-label="Mechanics"></nav>
        <div class="box list" id="list"></div>
        <div class="box" id="detail"></div>
      </div>
    </div>
    <div class="box wallet" id="wallet"><div class="label">Wallet</div></div>
  </div>
  <div class="foot">
    <div class="msg muted" id="next"></div>
    <div class="msg banner" id="banner" role="status"></div>
    <button id="bank">Wallet</button>
    <button id="fuse" style="display:none">Fuse</button>
    <button id="later">Decide later</button>
  </div>
</div>

<div class="scrim" id="scrim"><div class="dialog">
  <h3 id="dTitle"></h3><div id="dBody"></div>
  <div class="row"><button id="dCancel">Cancel</button><button class="primary" id="dOk">Confirm</button></div>
</div></div>

<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var MODES = ['upgrade', 'refine', 'reforge', 'perfect', 'overreach', 'promote', 'unique', 'respec'];
  // The rail's order and spacing: what grows a Pokémon, what tunes one trait, the gamble, the power, the undo.
  var RAIL = [['upgrade', 'promote'], ['refine', 'reforge', 'perfect'], ['overreach'], ['unique'], ['respec']];
  var RARITIES = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythical'];
  /**
   * Each mechanic's identity: hue, the one line under its name, a 10x10 pixel icon ('#' is a lit pixel, drawn in the hue), and its first-open
   * tutorial (does / costs / risk). Promote takes the colour of the tier it leads to.
   */
  var MODE_INFO = {
    upgrade: { hue: '#4ad8f6', verb: 'Raise a rank', icon: ['....##....', '...####...', '..##..##..', '.##....##.', '....##....', '...####...', '..##..##..', '.##....##.', '..........', '##########'],
      does: "Raises one trait a rank and rerolls its value in the higher rank's range.", costs: 'One upgrade. Your Pokémon earns one every 10 levels.', risk: 'None. It never fails.' },
    refine: { hue: '#5fe3b0', verb: 'Reroll the value', icon: ['##########', '#........#', '#.##.....#', '#.##.....#', '#...##...#', '#...##...#', '#.....##.#', '#.....##.#', '#........#', '##########'],
      does: "Rerolls a trait's value inside its current rank.", costs: 'Resonance Dust and Facets.', risk: 'The new value can be lower than now.' },
    reforge: { hue: '#b48cff', verb: 'Reroll the trait', icon: ['...#......', '..##......', '.########.', '..##.....#', '...#.....#', '#.....#...', '#.....##..', '.########.', '......##..', '......#...'],
      does: 'Rerolls which trait the slot holds. The rank stays and the value rerolls. The same trait can come back.', costs: 'Resonance Dust and Facets.', risk: 'The new trait is random. It also clears a perfected floor.' },
    perfect: { hue: '#f2cf3a', verb: 'Lift the floor', icon: ['..######..', '.#.#..#.#.', '##########', '#..#..#..#', '.#..##..#.', '..#.##.#..', '...####...', '....##....', '..........', '##########'],
      does: 'Raises the lowest value a rank V trait can roll, one point a step. A Refine never rolls below it.', costs: 'Resonance Dust, 10 more each step on the same trait.', risk: 'None, but a Reforge clears the floor.' },
    overreach: { hue: '#ff7a5c', verb: 'Gamble past cap', icon: ['.....####.', '....####..', '...####...', '..#######.', '.....###..', '....###...', '...###....', '..###.....', '.##.......', '#.........'],
      does: 'One try per trait to push a rank V trait at the top of its range past the cap.', costs: 'Dust, Facets and a Tower Mark, spent win or lose.', risk: 'Lose and the value falls to the lower half. Win or lose, the slot is sealed.' },
    promote: { hue: '', verb: 'Raise the rarity', icon: ['....##....', '....##....', '...####...', '##########', '.########.', '..######..', '..######..', '.###..###.', '.##....##.', '#........#'],
      does: 'Raises this Pokémon one rarity tier and opens a new trait slot.', costs: 'Materials, plus attunement from Tower boss clears.', risk: 'None. It never fails and keeps every trait.' },
    unique: { hue: '#ff7ad9', verb: 'A special power', icon: ['....##....', '....##....', '...####...', '..######..', '##########', '##########', '..######..', '...####...', '....##....', '....##....'],
      does: 'Sets a Unique: one special power with a benefit and a drawback.', costs: 'One Unique Catalyst and one Tower Mark. Fragments assemble into Catalysts.', risk: 'A Unique already set is lost when you replace it.' },
    respec: { hue: '#e3c48f', verb: 'Undo every rank', icon: ['##########', '.#......#.', '..#....#..', '...####...', '....##....', '....##....', '...#..#...', '..#.##.#..', '.#.####.#.', '##########'],
      does: 'Puts every trait back to rank I and returns every upgrade you spent.', costs: 'One Hourglass of Undoing, bought with Tower Marks.', risk: 'Dust and Facets are not refunded. An Overreached Pokémon cannot be respecced.' }
  };
  var SVGNS = 'http://www.w3.org/2000/svg';
  function pixelIcon(rows) {
    var svg = document.createElementNS(SVGNS, 'svg'), d = '';
    svg.setAttribute('viewBox', '0 0 10 10'); svg.setAttribute('class', 'ico'); svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('shape-rendering', 'crispEdges');
    rows.forEach(function (r, y) { for (var x = 0; x < r.length; x++) if (r.charAt(x) === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; });
    var path = document.createElementNS(SVGNS, 'path'); path.setAttribute('d', d); path.setAttribute('fill', 'currentColor'); svg.appendChild(path);
    return svg;
  }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hueOf(m) { return m === 'promote' ? (cssVar('--' + ((view && view.promotion.toRarity) || (view && view.rarityId) || 'legendary')) || '#ffd437') : MODE_INFO[m].hue; }
  function rgba(hex, a) {
    var h = hex.replace('#', ''); if (h.length === 3) h = h.replace(/./g, '$&$&');
    var n = parseInt(h, 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  var coachOpen = '';   // a mechanic whose tutorial the player reopened with the heading's ? button

  /**
   * Whether to show the first-open tutorial for mechanic m. A.hasSeen(id) says whether this player already dismissed 'craft.' + m; A.seen is null
   * until the server has answered. Called on every redraw of the detail.
   */
  function shouldCoach(m) {
    if (coachOpen === m) return true;   // the player asked with ?
    if (A.seen === null || phase !== 'browse') return false;   // not known yet, or a dialog is open
    // On first sight, even when the mechanic is blocked: a locked Overreach or Perfect is exactly when a player asks "why can't I?", and the card
    // says what it needs (a rank V trait at its band top). The screen's opening mechanic (Upgrade, or Refine with none waiting) gets the first card.
    return !A.hasSeen('craft.' + m);
  }
  var view = null, mode = 'upgrade', slotId = '', uniqueId = '', phase = 'browse', pendingOp = '', banner = '', bannerOk = false, waitTimer = 0, action = '';   // action: what the open dialog confirms when it is not simply the tab's own: 'prism' or 'buy'

  function slot() { for (var i = 0; i < view.slots.length; i++) if (view.slots[i].slotId === slotId) return view.slots[i]; return null; }
  var SLOT_MODES = ['upgrade', 'refine', 'reforge', 'perfect', 'overreach'];
  function hauntShown() { return !!view && !!view.haunt && view.haunt.show && SLOT_MODES.indexOf(mode) >= 0; }
  function isHaunt() { return slotId === 'haunt' && hauntShown(); }
  function hauntIcon(id, cls) { var i = new Image(); i.alt = ''; i.className = cls || 'ic'; i.src = 'icons/haunting/' + id + '.png'; i.onerror = function () { i.style.visibility = 'hidden'; }; return i; }
  function essenceIcon() { var i = new Image(); i.alt = ''; i.className = 'ic'; i.src = 'icons/spooky_essence.png'; return i; }
  function blockFor(s) {
    if (mode === 'promote') return view.promotion.block;
    if (mode === 'unique') return view.unique.block;
    if (mode === 'respec') return view.respec.hourglassBlock;
    return !s ? '' : mode === 'upgrade' ? s.upgradeBlock : mode === 'refine' ? s.refineBlock : mode === 'perfect' ? s.perfectBlock : mode === 'overreach' ? s.overreachBlock : s.reforgeBlock;
  }
  function validUnique(wanted) {
    var o = view.unique.options;
    for (var i = 0; i < o.length; i++) if (o[i].id === wanted) return wanted;
    for (i = 0; i < o.length; i++) if (o[i].current) return o[i].id;
    return o.length ? o[0].id : '';
  }
  function uniqueOpt() { var o = view.unique.options; for (var i = 0; i < o.length; i++) if (o[i].id === uniqueId) return o[i]; return null; }
  function uniqueReady() { return !!uniqueId && !view.unique.block && uniqueId !== view.unique.currentId; }
  function shortPrice(p) {
    var parts = [];
    if (p.dust > 0) parts.push(p.dust + ' Dust');
    if (p.facets > 0) parts.push(p.facets + (p.facets === 1 ? ' Facet' : ' Facets'));
    if (p.cores > 0) parts.push(p.cores + (p.cores === 1 ? ' Core' : ' Cores'));
    if (p.apex > 0) parts.push(p.apex + (p.apex === 1 ? ' Apex Shard' : ' Apex Shards'));
    return parts.length ? parts.join(' + ') : 'Free';
  }
  function costText() {
    if (isHaunt()) return view.haunt.cost + ' Spooky Essence (you have ' + view.haunt.essence + ')';
    switch (mode) {
      case 'upgrade': return '1 pending upgrade (you have ' + view.pending + ')';
      case 'refine': return shortPrice(view.refine);
      case 'reforge': return shortPrice(view.reforge);
      case 'perfect': { var ps = slot(); return ps ? ps.perfectCost + ' Resonance Dust (you have ' + view.dust + ')' : '—'; }
      case 'overreach': { var os = slot(); var apex = view.overreachApex > 0 ? ' + ' + view.overreachApex + ' Apex Shard' : ''; return os ? os.overreachDust + ' Resonance Dust + ' + os.overreachFacets + ' Facets + 1 Tower Mark' + apex + ' (you have ' + view.dust + ' / ' + view.facets + ' / ' + view.marks + (apex ? ' / ' + view.apex : '') + ')' : '—'; }
      case 'promote': return shortPrice(view.promotion.price);
      case 'respec': return '1 Hourglass of Undoing (you have ' + view.respec.hourglasses + ')';
      default: return '1 Unique Catalyst + 1 Tower Mark (you have ' + view.unique.catalysts + ' / ' + view.marks + ')';
    }
  }
  function shortCost() { if (isHaunt()) return view.haunt.cost + ' Spooky Essence'; var ps = slot(); return mode === 'upgrade' ? '1 upgrade' : mode === 'respec' ? '1 Hourglass' : mode === 'unique' ? '1 Catalyst + 1 Mark' : mode === 'perfect' ? (ps ? ps.perfectCost + ' Dust' : '—') : mode === 'overreach' ? (ps ? ps.overreachDust + ' Dust + ' + ps.overreachFacets + ' Facets + 1 Mark' + (view.overreachApex > 0 ? ' + ' + view.overreachApex + ' Apex' : '') : '—') : costText(); }
  function canReview() {
    var s = slot();
    if (mode === 'promote') return !view.promotion.block && !!view.promotion.toRarity;
    if (mode === 'unique') return uniqueReady();
    if (mode === 'respec') return !view.respec.hourglassBlock;
    if (isHaunt()) return !view.haunt.block;
    return !!s && !blockFor(s);
  }

  function railNote(m) {
    if (m === 'upgrade') return view.pending > 0 ? view.pending + ' to spend' : MODE_INFO.upgrade.verb;
    if (m === 'promote') return view.promotion.toRarity ? 'Next: ' + A.rarityName(view.promotion.toRarity) : 'Top tier reached';
    return MODE_INFO[m].verb;
  }
  function drawTabs() {
    var box = $('tabs'); box.innerHTML = '';
    RAIL.forEach(function (group, gi) {

  function drawDialog() {
    var scrim = $('scrim');
    if (phase === 'browse') { scrim.className = 'scrim'; return; }
    scrim.className = 'scrim on';
    var s = slot(), body = $('dBody'); body.innerHTML = '';
    $('dTitle').textContent = phase === 'waiting' ? 'Working…' : isHaunt() ? (view.haunt.id ? 'Confirm re-roll' : 'Confirm haunting') : action === 'prism' ? 'Confirm unbinding' : action === 'buy' ? 'Confirm purchase' : mode === 'respec' ? 'Confirm respec' : 'Confirm ' + mode;
    var change = '';
    if (isHaunt()) change = view.haunt.id ? 'Re-roll ' + view.haunt.name + ': it is replaced by a new random Haunting (it can land on the same one).' : 'Give ' + view.name + ' a random Haunting.';
    else if (mode === 'upgrade' && s) change = s.name + ' ' + A.roman[s.rank] + ' +' + s.value + '%  →  ' + A.roman[Math.min(5, s.rank + 1)] + ', rolls ' + s.nextMin + '–' + s.nextMax + '%';
    else if (mode === 'refine' && s) change = s.name + ' +' + s.value + '%  →  a new value in ' + s.bandMin + '–' + s.bandMax + '%';
    else if (mode === 'overreach' && s) change = s.name + ' +' + s.value + '%  →  ' + s.overreachChance + '% chance of +' + s.overreachMin + '–' + s.overreachMax + '%; otherwise it falls to the lower half of the band. Either way the slot is sealed.';
    else if (mode === 'perfect' && s) change = s.name + ' floor +' + s.floor + '%  →  +' + (s.floor + 1) + '% (band top ' + s.bandMax + '%), value +' + s.value + '% → +' + Math.max(s.value, s.floor + 1) + '%';
    else if (mode === 'promote') change = A.rarityName(view.rarityId) + '  →  ' + A.rarityName(view.promotion.toRarity) + ', and one new rank I trait';
    else if (action === 'buy') change = 'Trade ' + view.respec.price + ' Tower Marks for one Hourglass of Undoing.';
    else if (action === 'prism') { var po = uniqueOpt(); change = po ? 'Swap ' + view.uniqueName + ' for ' + po.name + '. Drawback: ' + po.drawback : ''; }
    else if (mode === 'respec') change = 'Reset ' + view.respec.resets.length + ' traits to rank I and return ' + view.respec.spent + (view.respec.spent === 1 ? ' upgrade credit' : ' upgrade credits') + '. Perfected floors are cleared.';
    else if (mode === 'unique') { var o = uniqueOpt(); change = o ? (view.unique.currentId ? 'Replace with ' : 'Install ') + o.name + '. Drawback: ' + o.drawback : ''; }
    else if (s) change = s.name + ' +' + s.value + '%  →  another trait (' + s.reforgePool + ' eligible), rank ' + A.roman[s.rank];
    body.appendChild(A.el('p', '', change));
    body.appendChild(A.el('p', 'gold', 'Cost: ' + (isHaunt() ? costText() : action === 'prism' ? '1 Unbinding Prism (no Catalyst, no Tower Mark)' : action === 'buy' ? view.respec.price + ' Tower Marks (you have ' + view.respec.marks + ')' : costText())));
    body.appendChild(A.el('p', 'muted', isHaunt() ? 'The roll is random and cannot be undone. A re-roll loses the Haunting it replaces for good.' : action === 'prism' ? 'Uses one Unbinding Prism. The Unique you hold now is lost. It cannot be undone.'
      : action === 'buy' ? 'The Marks are spent and the Hourglass joins your wallet.'
      : mode === 'respec' ? 'Uses one Hourglass of Undoing. Nothing is refunded and it cannot be undone. A Pokémon that has Overreached can never be respecced.'
      : mode === 'upgrade' ? 'No failure chance. This spends one pending upgrade.'
      : mode === 'refine' ? 'The result can be lower than now. It cannot be undone.'
      : mode === 'perfect' ? 'Always works. Each step costs 10 more dust than the last on this slot. A Refine keeps the floor; a Reforge clears it.'
      : mode === 'overreach' ? 'RISKY. The materials are spent win or lose. A lost attempt lowers the roll and seals the slot for good (a Reforge is the only way out). This cannot be undone.'
      : mode === 'promote' ? 'No failure chance. Existing traits are kept. It cannot be undone.'
      : mode === 'unique' ? 'Uses one Catalyst. A Unique already set is lost. It cannot be undone.' : 'The result is random and cannot be undone.'));
    if (phase === 'waiting') body.appendChild(A.el('p', 'muted', 'Waiting for the server…'));
    $('dOk').disabled = phase === 'waiting'; $('dCancel').disabled = phase === 'waiting';
  }

  /** Moves the highlight to the chosen row without rebuilding the list (rows carry their slot or Unique id in data-k). */
  function markSel() {
    var want = mode === 'unique' ? uniqueId : slotId, rows = $('list').children;
    for (var i = 0; i < rows.length; i++) { var k = rows[i].dataset.k; if (k !== undefined) rows[i].classList.toggle('sel', k === want); }
  }

  /**
   * Redraws only what a change touches. part: 'sel' (a row was chosen), 'mode' (a tab was chosen), 'phase' (a dialog opened, closed or is
   * waiting); anything else is new data from the server and redraws everything.
   */
  function render(part) {
    if (!view) return;
    if (part === 'sel') { markSel(); drawDetail(); return; }
    if (part === 'mode') { drawTabs(); drawList(); drawDetail(); drawWallet(); return; }   // the wallet marks what the new mechanic spends
    if (part === 'phase') { drawDetail(); drawDialog(); return; }
    A.text($('name'), view.name); A.text($('lvl'), 'Lv ' + view.level);
    var gr = $('grade'); A.text(gr, A.rarityName(view.rarityId).toUpperCase() + (view.uniqueName ? ' · UNIQUE' : ''));
    gr.style.background = 'var(--' + (view.rarityId || 'common') + '-bg)'; gr.style.color = 'var(--' + (view.rarityId || 'common') + ')';
    var art = $('art');
    if (art.dataset.species !== view.speciesId) { art.dataset.species = view.speciesId; art.innerHTML = ''; art.appendChild(A.sprite(view.speciesId, 2)); }   // not on every click: it flashes the name
    A.setBezel(view.rarityId);
    A.text($('pend'), view.pending); A.text($('pendLabel'), view.pending === 1 ? 'upgrade available' : 'upgrades available');
    A.text($('next'), view.nextMilestone > 0 ? 'Next upgrade at Lv ' + view.nextMilestone : 'All level milestones reached');
    $('fuse').style.display = view.rarityId === 'mythical' ? '' : 'none';
    drawTabs(); drawList(); drawDetail(); drawWallet(); drawDialog();
  }

  function submit(kind, slot) {
    pendingOp = A.newId(); phase = 'waiting'; render('phase');
    A.send('ascension_craft_confirm', { operationId: pendingOp, pokemonId: view.pokemonId, kind: kind, slotId: slot || '',
      profileRevision: view.profileRevision, walletRevision: view.walletRevision });
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () {
      if (phase === 'waiting') { phase = 'browse'; pendingOp = ''; banner = 'No answer from the server. Check your materials and try again.'; bannerOk = false; render(); }
    }, 8000);
  }
  function confirm() {
    if (phase !== 'review' || !(action === 'buy' ? view.respec.marks >= view.respec.price : action === 'prism' ? (!view.respec.prismBlock && !!uniqueId && uniqueId !== view.unique.currentId) : canReview())) return;
    var s = slot();
    if (isHaunt()) { submit('haunt', ''); return; }
    if (action === 'buy') { submit('buy_hourglass', ''); return; }
    if (action === 'prism') { submit('respec_unique', uniqueId); return; }
    if (mode === 'respec') { submit('respec_ranks', ''); return; }
    submit(mode, mode === 'promote' ? '' : mode === 'unique' ? uniqueId : s.slotId);
  }
  function assemble() {
    if (phase !== 'browse' || mode !== 'unique' || view.unique.fragments < view.unique.fragmentsNeeded) return;
    submit('assemble', '');
  }

  A.onSeen(function () { if (view) drawDetail(); });
  A.on('craftView', function (v) {
    var first = !view; view = v;
    var won = stampFor(landed, v); landed = null;
    if (first) { mode = v.pending > 0 ? 'upgrade' : 'refine'; if (v.slots.length) slotId = v.slots[0].slotId; }
    uniqueId = validUnique(uniqueId);
    var found = false; v.slots.forEach(function (s) { if (s.slotId === slotId) found = true; });
    if (slotId === 'haunt' && v.haunt && v.haunt.show) found = true;
    if (!found) slotId = v.slots.length ? v.slots[0].slotId : '';
    if (v.message && !banner) { banner = v.message; bannerOk = false; }
    render();
    if (won) stamp(won);
  });
  A.on('craftDone', function (d) {
    if (d.operationId !== pendingOp) return;
    if (d.ok) { var det = $('detail'); det.classList.remove('landed'); void det.offsetWidth; det.classList.add('landed'); }   // restart the sweep for each craft
    if (d.ok && !d.replayed) landed = { mode: mode, slotId: d.slotId, oldRank: d.oldRank, rarity: view.rarityId };
    clearTimeout(waitTimer); pendingOp = ''; phase = 'browse'; bannerOk = !!d.ok;
    var did = action; action = '';
    var wasHaunt = isHaunt();
    if (d.ok && wasHaunt) {
      banner = (d.newRank === 1 ? 'Rare! ' : 'Haunted: ') + d.newName; if (d.replayed) banner += ' (already done)';
    } else if (d.ok) {
      var was = A.roman[Math.max(1, Math.min(5, d.oldRank))], now = A.roman[Math.max(1, Math.min(5, d.newRank))];
      banner = did === 'buy' ? 'Bought an Hourglass of Undoing for ' + view.respec.price + ' Tower Marks'
        : did === 'prism' ? 'Unique swapped: ' + d.newName
        : mode === 'respec' ? 'Reset to rank I: ' + d.oldValue + (d.oldValue === 1 ? ' upgrade credit' : ' upgrade credits') + ' back to spend'
        : mode === 'upgrade' ? d.newName + ' → ' + now + ' +' + d.newValue + '%'
        : mode === 'refine' ? 'Refined: +' + d.oldValue + '% → +' + d.newValue + '%'
        : mode === 'perfect' ? 'Floor raised: +' + d.oldValue + '% → +' + d.newValue + '%'
        : mode === 'overreach' ? (d.newValue > d.oldValue ? 'Overreached! +' + d.oldValue + '% → +' + d.newValue + '%' : 'The gamble failed: +' + d.oldValue + '% → +' + d.newValue + '%, and the slot is sealed')
        : mode === 'reforge' ? 'Now ' + d.newName + ' +' + d.newValue + '%'
        : mode === 'promote' ? 'Promoted to ' + A.rarityName(d.newName) + ': a new trait slot opened'
        : (d.newName === 'Unique Catalyst' ? 'Assembled a Unique Catalyst' : 'Unique set: ' + d.newName);
      if (d.replayed) banner += ' (already done)';
    } else banner = d.message;
    if (mode === 'overreach' && d.ok && !wasHaunt) bannerOk = d.newValue > d.oldValue;
    render();
  });

  $('bank').addEventListener('click', function () { if (phase === 'browse') A.send('ascension_wallet_open'); });
  $('close').addEventListener('click', function () { if (phase !== 'waiting') A.send('close'); });
  $('later').addEventListener('click', function () { if (phase !== 'waiting') A.send('close'); });
  $('fuse').addEventListener('click', function () { if (view && phase === 'browse') A.send('ascension_fusion_open', { hostId: view.pokemonId }); });
  $('dCancel').addEventListener('click', function () { if (phase === 'review') { phase = 'browse'; action = ''; render('phase'); } });
  $('dOk').addEventListener('click', confirm);

  function ready() {
    A.ready('ascension_craft_ready', function () { return !!view; }, $('next'));
  }
  ready();
})();
</script>
</body>
</html>
