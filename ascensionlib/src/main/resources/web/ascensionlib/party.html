<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AscensionDex</title>
<meta name="color-scheme" content="dark">
<style>html, body { background: transparent; }</style>
<link rel="stylesheet" href="ascension.css">
<style>
  /* the same 1040 x 600 tablet as every other Dex screen (ascension.css), so moving between screens never resizes the device */
  .main { flex: 1; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .hint { color: var(--muted); font-size: var(--fs-body); display: flex; justify-content: space-between; align-items: center; }
  .legend { display: flex; align-items: center; gap: 5px; font-size: var(--fs-meta); }
  .legend i { width: 16px; height: 14px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; color: var(--scr); background: var(--acc); border: 1px solid var(--outline); margin-left: 6px; }
  .legend i.g { background: #8fd0a8; } .legend i.open { background: transparent; border: 1px dashed var(--line); }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; }
  /* a party card: a raised panel with a sunk stage for the sprite, and a band along the bottom edge in the Pokemon's rarity colour (--rc, set per card) */
  .card { --rc: var(--line); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 22px 10px 12px; min-height: 0;
          background: var(--sheen), var(--row); border: 2px solid var(--line); cursor: pointer; text-align: center;
          box-shadow: var(--raised), inset 0 -4px 0 var(--rc); }
  .card:hover { border-color: var(--acc); }
  .card.sel { border-color: var(--gold); background: var(--sheen), var(--panel); box-shadow: var(--raised), inset 0 -4px 0 var(--rc), 0 0 0 2px var(--outline), 0 0 12px rgba(242, 207, 58, .45); }
  .card.empty { cursor: default; border-style: dashed; background: transparent; box-shadow: var(--sunk); justify-content: center; }
  .card.empty .sub { color: #3d6d80; }
  .card .slot { position: absolute; left: -2px; top: -2px; min-width: 22px; padding: 1px 6px; font-size: var(--fs-meta); color: var(--muted); background: var(--head); border: 2px solid var(--line); box-shadow: inset 1px 1px 0 var(--hi); }
  .card.sel .slot { color: var(--gold); border-color: var(--gold); }
  .card .badge { position: absolute; right: 6px; top: 5px; font-size: var(--fs-meta); padding: 0 5px; background: #0d2a1c; color: var(--good); border: 1px solid var(--good); box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); }
  .card .spr { width: 100%; flex: 1; min-height: 64px; display: flex; align-items: center; justify-content: center; position: relative;
               background: radial-gradient(ellipse 60% 70% at 50% 78%, rgba(74,216,246,.10), transparent 70%), var(--well); border: 2px solid #12384a; box-shadow: var(--sunk); }
  .card .spr::after { content: ""; position: absolute; bottom: 12%; left: 30%; right: 30%; height: 4px; background: rgba(0,0,0,.35); }   /* the floor shadow under the sprite */
  .card .spr { min-height: 0; overflow: hidden; }
  .card .spr > * { position: relative; z-index: 1; height: 100%; }
  /* the sprite fills what the card has left (up to its 3x size), so the rows under it always show */
  .card .spr img { height: 100% !important; width: auto !important; max-height: 96px; }
  .card .nm { margin-top: 4px; font-size: var(--fs-name); text-shadow: var(--glow); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { font-size: var(--fs-body); color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; }
  .card .sub .typechip { margin-left: 0; }
  /* one cell per trait slot: Attack cells, a gap, then Guard cells; the rank in the cell, an open slot dashed */
  .traits { display: flex; gap: 3px; align-items: center; justify-content: center; min-height: 16px; }
  .traits i { width: 18px; height: 16px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: var(--fs-meta);
              color: var(--scr); background: var(--acc); border: 1px solid var(--outline); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .traits i.g { background: #8fd0a8; }
  .traits i.v { background: var(--gold); }
  .traits i.open { background: transparent; border: 1px dashed var(--line); box-shadow: none; }
  .traits .sep { width: 6px; }
  /* what this Pokemon can do next, the card's call to action */
  .goal { font-size: var(--fs-meta); color: var(--muted); letter-spacing: .04em; min-height: 14px; }
  .goal.up { color: var(--good); } .goal.ready { color: var(--gold); }
  .tag { font-size: var(--fs-meta); padding: 0 6px; background: #46526a; color: #fff; border: 1px solid var(--outline); }
  /* HP as a segmented cell, like a handheld's battery meter */
  .hp { --hpc: var(--good); width: 86%; height: 8px; padding: 1px; background: var(--scr); border: 1px solid var(--line); box-shadow: inset 1px 1px 0 var(--lo); }
  .hp i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--hpc) 0 5px, transparent 5px 7px); }
  .hp.low { --hpc: var(--gold); } .hp.crit { --hpc: var(--warn); }
  .card.faint .nm { color: var(--warn); } .card.faint .spr { filter: grayscale(1) brightness(.7); }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .pane[hidden] { display: none; }
  /* the tab bar sits at the bottom of the Dex, above the footer */
  .tabbar { display: flex; gap: 0; padding: 0 14px; background: var(--head); border-top: 2px solid var(--line); }
  .tabbar button { border-top: 0; border-radius: 0; padding: 8px 22px; margin-right: 4px; box-shadow: none; background: transparent; color: var(--muted); border-color: transparent; letter-spacing: .08em; }
  .tabbar button:hover:not(:disabled):not(.on) { color: var(--ink); }
  .tabbar button.on { color: var(--acc); background: var(--sheen), var(--panel); border: 2px solid var(--line); border-top: 3px solid var(--acc); border-bottom: 0; box-shadow: inset 2px 0 0 var(--hi), inset -2px 0 0 var(--lo); text-shadow: var(--glow); }
  .foot .group[hidden] { display: none; } .foot .group { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>ASCENSIONDEX</span><button class="x" id="close" title="Close">&times;</button></div>
  <div class="main">
    <div class="pane" id="paneParty" data-boot>
      <div class="hint" id="hint"><span>Your party. Arrow keys pick, Enter inspects (or double-click).</span>
        <span class="legend" aria-label="Trait cells: Attack, Guard, and an open slot"><i class="a">I</i> Attack <i class="g">I</i> Guard <i class="open"></i> open slot</span></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="pane" id="paneWallet" hidden></div>
    <div class="pane" id="paneGuide" hidden></div>
  </div>
  <div class="tabbar" id="tabbar">
    <button class="on" id="tabParty">Party</button>
    <button id="tabWallet">Wallet</button>
    <button id="tabGuide">Guide</button>
  </div>
  <div class="foot">
    <div class="msg muted" id="info"></div>
    <div class="group" id="footParty">
      <button id="fuse" disabled>Fuse</button>
      <button id="upgrade" disabled title="Opens the Traits screen">Traits</button>
      <button class="primary" id="inspect" disabled>Inspect</button>
    </div>
    <div class="group" id="footWallet" hidden>
      <button class="primary" id="depositAll" disabled>Deposit all vouchers</button>
    </div>
    <button id="done">Close</button>
  </div>
</div>
<script src="ui.js"></script>
<script src="wallet-panel.js"></script>
<script src="guide-data.js"></script>
<script src="guide-panel.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var view = null, sel = -1, tab = 'party', wallet = null, guide = null, partyInfo = '';

  /**
   * The colour of the band along the bottom of a party card: what a player should read about this Pokemon at a glance across the room.
   * s has rarityId ('common'..'mythical', or '' when it has no ascension profile), fainted, pending (upgrades waiting) and locked (on loan).
   * Return any CSS colour; the rarity colours are var(--common) .. var(--mythical), and var(--line) is the plain panel edge.
   */
  function cardAccent(s) {
    // Rarity is who the Pokemon is, so it holds the band in every state: fainting greys the sprite and pending upgrades have their badge,
    // and neither should hide what it is. A Pokemon without a profile keeps the plain edge, so the band itself says "ascended".
    return s.rarityId ? 'var(--' + s.rarityId + ')' : 'var(--line)';
  }

  /** The trait slots as cells: each Attack then each Guard trait with its rank (gold at V), and its rarity's open slots dashed. */
  function traitCells(s) {
    var row = A.el('div', 'traits');
    row.title = 'Traits: ' + (s.attack || []).length + ' of ' + (s.attackSlots || 0) + ' Attack, ' + (s.guard || []).length + ' of ' + (s.guardSlots || 0) + ' Guard';
    function side(ranks, slots, cls) {
      for (var i = 0; i < Math.max(slots || 0, ranks.length); i++) {
        var r = ranks[i];
        row.appendChild(r ? A.el('i', cls + (r >= 5 ? ' v' : ''), A.roman[Math.min(5, r)]) : A.el('i', 'open'));
      }
    }
    side(s.attack || [], s.attackSlots, 'a');
    row.appendChild(A.el('span', 'sep'));
    side(s.guard || [], s.guardSlots, 'g');
    return row;
  }

  /** The one next step worth showing on a card, most useful first: an upgrade waiting, a promotion's attunement reached, the next milestone. [text, class] */
  function goalOf(s) {
    if (!s.rarityId) return ['Start: a Sigil gives it a profile', ''];
    if (s.pending > 0) return [s.pending + (s.pending === 1 ? ' upgrade' : ' upgrades') + ' to spend', 'up'];
    if (s.attunementNeeded > 0 && s.attunement >= s.attunementNeeded) return ['Attunement ready to promote', 'ready'];
    if (s.nextMilestone > 0) return ['Next upgrade at Lv ' + s.nextMilestone, ''];
    if (s.attunementNeeded > 0) return ['Attunement ' + s.attunement + ' / ' + s.attunementNeeded + ' to promote', ''];
    return ['Every milestone reached', ''];
  }

  var cards = [];   // the drawn cards by slot, so choosing one only moves the highlight instead of rebuilding the grid and re-decoding every sprite

  function pick(i) { sel = i; select(); }
  function inspect() { var s = view && view.slots[sel]; if (s && s.id) A.send('ascension_inspect_open', { kind: 'owned', id: s.id }); }

  function draw() {
    if (!view) return;
    var grid = $('grid'); grid.innerHTML = ''; cards = [];
    view.slots.forEach(function (s, i) {
      var card = A.el('div', 'card' + (s.id ? '' : ' empty') + (s.fainted ? ' faint' : ''));
      cards.push(card);
      if (s.id) card.style.setProperty('--rc', cardAccent(s));
      card.appendChild(A.el('span', 'slot', String(i + 1)));
      if (!s.id) { card.appendChild(A.el('div', 'sub', 'Empty slot')); grid.appendChild(card); return; }
      var spr = A.el('div', 'spr'); spr.appendChild(A.sprite(s.speciesId, 3)); card.appendChild(spr);
      card.appendChild(A.el('div', 'nm', (s.shiny ? '★ ' : '') + s.name));
      var sub = A.el('div', 'sub'); sub.appendChild(A.el('span', '', 'Lv ' + s.level));
      var tag = A.el('span', 'tag', s.rarityId ? A.rarityName(s.rarityId) : 'No profile');
      if (s.rarityId) { tag.style.background = 'var(--' + s.rarityId + '-bg)'; tag.style.color = 'var(--' + s.rarityId + ')'; }
      sub.appendChild(tag); (s.types || []).forEach(function (t) { sub.appendChild(A.typeChip(t)); }); card.appendChild(sub);
      if (s.rarityId) card.appendChild(traitCells(s));
      var g = goalOf(s); card.appendChild(A.el('div', 'goal' + (g[1] ? ' ' + g[1] : ''), g[0]));
      var hp = A.el('div', 'hp' + (s.hp < 25 ? ' crit' : s.hp < 50 ? ' low' : '')); var fill = A.el('i'); fill.style.width = s.hp + '%'; hp.appendChild(fill); card.appendChild(hp);
      card.addEventListener('click', function () { pick(i); });
      card.addEventListener('dblclick', function () { pick(i); inspect(); });
      grid.appendChild(card);
    });
    select();
  }

  /** Highlights the chosen card and sets the buttons and the footer line to match it. */
  function select() {
    cards.forEach(function (card, i) { card.classList.toggle('sel', i === sel); });
    var s = view.slots[sel];
    $('inspect').disabled = !(s && s.id);
    $('upgrade').disabled = !(s && s.id && s.rarityId && !s.locked);
    $('upgrade').title = s && s.locked ? 'This Pokemon is on loan and cannot be upgraded.' : s && s.id && !s.rarityId ? 'It has no ascension profile yet: inspect it to use an Ascension Sigil.' : '';
    $('fuse').disabled = !(s && s.id);
    $('fuse').title = s && s.id ? 'Fuse: open the fusion screen with ' + s.name + ' as the host (a Radiant Pokémon with a Unique can be one; you can change it there).' : 'Pick a Pokemon first.';
    // the footer says why a button is off, where the player is already looking (a tooltip may not show in the game's browser)
    partyInfo = !(s && s.id) ? 'Pick a Pokemon'
      : !s.rarityId ? s.name + ' has no profile yet: Inspect it to use an Ascension Sigil.'
      : s.locked ? s.name + ' is on loan: its traits cannot change until it is returned.'
      : s.name;
    if (tab === 'party') A.text($('info'), partyInfo);
  }

  A.on('partyView', function (v) { view = v; if (sel < 0 || !v.slots[sel] || !v.slots[sel].id) { sel = -1; for (var i = 0; i < v.slots.length; i++) if (v.slots[i].id) { sel = i; break; } } draw(); });
  // The two tabs: the party, and the wallet (the same panel as the Wallet page, mounted the first time it is opened).
  function showTab(name) {
    tab = name;
    $('paneParty').hidden = name !== 'party'; $('paneWallet').hidden = name !== 'wallet'; $('paneGuide').hidden = name !== 'guide';
    $('footParty').hidden = name !== 'party'; $('footWallet').hidden = name !== 'wallet';
    $('hint').hidden = name !== 'party';
    $('tabParty').className = name === 'party' ? 'on' : ''; $('tabWallet').className = name === 'wallet' ? 'on' : ''; $('tabGuide').className = name === 'guide' ? 'on' : '';
    if (name === 'wallet') {
      if (!wallet) wallet = A.wallet.mount($('paneWallet'), {
        onView: function (v) {
          if (tab === 'wallet') A.text($('info'), v.freeSlots + ' free inventory slot' + (v.freeSlots === 1 ? '' : 's') + ' (64 units per slot)');
          $('depositAll').disabled = !v.lines.some(function (l) { return l.carried > 0; });
        }
      });
      wallet.refresh();
      var v = wallet.view();
      if (v) A.text($('info'), v.freeSlots + ' free inventory slot' + (v.freeSlots === 1 ? '' : 's') + ' (64 units per slot)'); else A.text($('info'), 'Loading wallet…');
    } else if (name === 'guide') {
      if (!guide) guide = A.guide.mount($('paneGuide'));
      A.text($('info'), 'How AscensionLib works. The same text is on the wiki.');
    } else A.text($('info'), partyInfo);
  }
  $('tabParty').addEventListener('click', function () { showTab('party'); });
  $('tabWallet').addEventListener('click', function () { showTab('wallet'); });
  $('tabGuide').addEventListener('click', function () { showTab('guide'); });
  // Fuse is not a tab: it opens the fusion screen (the craft screen's Fuse button sends the same message) with the chosen Pokemon as the host.
  $('fuse').addEventListener('click', function () { var s = view && view.slots[sel]; if (s && s.id && !$('fuse').disabled) A.send('ascension_fusion_open', { hostId: s.id }); });
  // The keyboard: arrows move across the 3 x 2 grid (over empty slots too), Enter inspects, T opens Traits.
  document.addEventListener('keydown', function (e) {
    if (tab !== 'party' || !view || e.target.tagName === 'INPUT') return;
    var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 }[e.key];
    if (step) {
      e.preventDefault();
      for (var i = (sel < 0 ? 0 : sel) + step; i >= 0 && i < view.slots.length; i += step) if (view.slots[i].id) { pick(i); break; }   // skip empty slots
    }
    else if (e.key === 'Enter') { e.preventDefault(); inspect(); }
    else if ((e.key === 't' || e.key === 'T') && !$('upgrade').disabled) $('upgrade').click();
  });
  $('depositAll').addEventListener('click', function () { if (wallet) wallet.depositAll(); });
  $('inspect').addEventListener('click', inspect);
  $('upgrade').addEventListener('click', function () { var s = view && view.slots[sel]; if (s && s.id && !$('upgrade').disabled) A.send('ascension_craft_open', { pokemonId: s.id }); });
  $('close').addEventListener('click', function () { A.send('close'); });
  $('done').addEventListener('click', function () { A.send('close'); });

  A.firstTime('dex.home', 'Your AscensionDex', ['Each card is a Pokémon in your party: its rarity, types and traits.', 'The line under its traits says what it can do next.', 'Inspect shows everything about it. Traits is where you upgrade it.']);

  function ready() {
    A.ready('ascension_party_ready', function () { return !!view; }, $('info'));
  }
  ready();
})();
</script>
</body>
</html>
